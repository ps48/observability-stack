# Data Prepper Pipeline Configuration
# Processes and transforms logs, traces, and metrics before writing to OpenSearch

# Main OTLP pipeline - receives all telemetry and routes by type
otlp-pipeline:
  delay: 10
  source:
    # OTLP source receives telemetry via OpenTelemetry Protocol
    otlp:
      # Listen on port 21890 for gRPC connections from OpenTelemetry Collector
      port: 21890
      # Disable SSL for development
      ssl: false
  # Route telemetry by signal type
  route:
    # GenAI evaluation results are OTel log-based events (gen_ai.evaluation.result).
    # They go to their own index instead of the general logs index.
    - evaluations: "getEventType() == \"LOG\" and /eventName == \"gen_ai.evaluation.result\""
    - logs: "getEventType() == \"LOG\" and /eventName != \"gen_ai.evaluation.result\""
    - traces: "getEventType() == \"TRACE\""
  # Send to appropriate sub-pipelines
  sink:
    - pipeline:
        name: "otel-logs-pipeline"
        routes:
          - "logs"
    - pipeline:
        name: "genai-evaluation-pipeline"
        routes:
          - "evaluations"
    - pipeline:
        name: "otel-traces-pipeline"
        routes:
          - "traces"

# Log processing pipeline
# Receives logs from main pipeline and writes to OpenSearch
otel-logs-pipeline:
  workers: 5
  delay: 10
  source:
    pipeline:
      name: "otlp-pipeline"
  buffer:
    bounded_blocking:
  processor:
    - copy_values:
        entries:
          - from_key: "time"
            to_key: "@timestamp"
  # Write processed logs to OpenSearch
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        # Disable SSL verification for development
        insecure: true
        # Use log analytics index type for automatic index management
        index_type: log-analytics-plain

# Trace processing pipeline
# Receives traces from main pipeline and distributes to raw and service map pipelines
otel-traces-pipeline:
  delay: 100
  source:
    pipeline:
      name: "otlp-pipeline"
  # Send traces to both raw storage and service map generation
  sink:
    - pipeline:
        name: "traces-raw-pipeline"
    - pipeline:
        name: "service-map-pipeline"

# Raw trace storage pipeline
# Stores individual trace spans in OpenSearch
traces-raw-pipeline:
  source:
    pipeline:
      name: "otel-traces-pipeline"
  processor:
    # Process raw trace data for OpenSearch storage
    - otel_traces:
  route:
    # Deprecated SDK carrier: scores sent as "evaluation <name>" spans.
    - evaluation_spans: '/attributes/gen_ai.operation.name == "evaluation" and /attributes/gen_ai.evaluation.name != null'
  sink:
    - pipeline:
        name: "genai-evaluation-span-pipeline"
        routes: [evaluation_spans]
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        insecure: true
        # Use trace analytics index type for automatic index management
        index_type: trace-analytics-plain-raw

# GenAI evaluation results (gen_ai.evaluation.result log events) from the OTLP
# logs path, plus scores from the deprecated span carrier. One document per
# result in otel-v1-genai-evaluation-*, keyed to the evaluated span by
# traceId/spanId. Data Prepper adds normalized fields under attributes.derived.*
genai-evaluation-pipeline:
  workers: 2
  delay: 10
  source:
    pipeline:
      name: "otlp-pipeline"
  processor:
    - copy_values:
        entries:
          - from_key: "time"
            to_key: "@timestamp"
    # Level: SDK attribute, then AgentCore's, then span if the record has a span.
    - add_entries:
        entries:
          - key: "/attributes/derived.evaluation.level"
            value_expression: "/attributes/opensearch.evaluation.level"
            add_when: "/attributes/opensearch.evaluation.level != null"
          - key: "/attributes/derived.evaluation.level"
            value_expression: "/attributes/aws.bedrock_agentcore.evaluation_level"
            add_when: "/attributes/derived.evaluation.level == null and /attributes/aws.bedrock_agentcore.evaluation_level != null"
          - key: "/attributes/derived.evaluation.level"
            value: "span"
            add_when: "/attributes/derived.evaluation.level == null and /spanId != null and /spanId != \"\""
          - key: "/attributes/derived.evaluation.level"
            value: "trace"
            add_when: "/attributes/derived.evaluation.level == null"
    - lowercase_string:
        with_keys: ["/attributes/derived.evaluation.level"]
    - add_entries:
        entries:
          - key: "/attributes/derived.evaluation.source"
            value: "agentcore"
            add_when: "/attributes/aws.bedrock_agentcore.evaluation_level != null"
          - key: "/attributes/derived.evaluation.source"
            value: "opensearch-sdk"
            add_when: "/attributes/derived.evaluation.source == null and (/attributes/opensearch.evaluation.level != null or /attributes/opensearch.evaluation.evaluator.type != null)"
          - key: "/attributes/derived.evaluation.source"
            value: "otel"
            add_when: "/attributes/derived.evaluation.source == null"
          - key: "/attributes/derived.session.id"
            value_expression: "/attributes/gen_ai.conversation.id"
            add_when: "/attributes/gen_ai.conversation.id != null"
          - key: "/attributes/derived.session.id"
            value_expression: "/attributes/session.id"
            add_when: "/attributes/derived.session.id == null and /attributes/session.id != null"
          - key: "/attributes/derived.evaluation.target_trace_id"
            value_expression: "/traceId"
            add_when: "/traceId != null and /traceId != \"\""
          - key: "/attributes/derived.evaluation.target_trace_id"
            value_expression: "/attributes/opensearch.evaluation.trace_id"
            add_when: "/attributes/derived.evaluation.target_trace_id == null and /attributes/opensearch.evaluation.trace_id != null"
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        insecure: true
        index: "otel-v1-genai-evaluation-%{yyyy.MM.dd}"
        template_type: index-template
        template_file: /usr/share/data-prepper/templates/genai-evaluation-index-template.json

# Deprecated SDK span carrier: reshape each "evaluation <name>" span into the
# same log-record shape (the evaluated span is the score span's parent).
genai-evaluation-span-pipeline:
  source:
    pipeline:
      name: "traces-raw-pipeline"
  processor:
    - copy_values:
        entries:
          - from_key: "/spanId"
            to_key: "/attributes/opensearch.evaluation.carrier_span_id"
          - from_key: "/parentSpanId"
            to_key: "/spanId"
            overwrite_if_to_key_exists: true
          - from_key: "/endTime"
            to_key: "/time"
          - from_key: "/endTime"
            to_key: "/@timestamp"
    - add_entries:
        entries:
          - key: "/eventName"
            value: "gen_ai.evaluation.result"
          - key: "/severityNumber"
            value: 9
          - key: "/attributes/derived.evaluation.level"
            value: "span"
          - key: "/attributes/derived.evaluation.source"
            value: "opensearch-sdk"
          - key: "/attributes/derived.evaluation.target_trace_id"
            value_expression: "/traceId"
          - key: "/attributes/derived.session.id"
            value_expression: "/attributes/gen_ai.conversation.id"
            add_when: "/attributes/gen_ai.conversation.id != null"
    - delete_entries:
        with_keys: ["parentSpanId", "startTime", "endTime", "durationInNanos", "kind", "name", "status", "events", "links",
                    "traceState", "traceGroup", "traceGroupFields", "droppedEventsCount", "droppedLinksCount",
                    "/attributes/gen_ai.operation.name"]
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        insecure: true
        index: "otel-v1-genai-evaluation-%{yyyy.MM.dd}"
        template_type: index-template
        template_file: /usr/share/data-prepper/templates/genai-evaluation-index-template.json

# Service map generation pipeline (APM)
# Builds service dependency maps and RED metrics from trace relationships.
# Splits into two sub-pipelines so we can strip high-cardinality `randomKey`
# labels from the Cortex branch without polluting the service-map branch.
service-map-pipeline:
  delay: 100
  source:
    pipeline:
      name: "otel-traces-pipeline"
  processor:
    # APM service map processor - generates topology, service details, and RED metrics
    - otel_apm_service_map:
        group_by_attributes: [telemetry.sdk.language]
        window_duration: 10s
  route:
    - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
    - service_processed_metrics: 'getEventType() == "METRIC"'
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        index_type: otel-v2-apm-service-map
        routes: [otel_apm_service_map_route]
        insecure: true
    # Fan out service-derived RED metrics to a dedicated pipeline that strips
    # the per-event randomKey UUID before Cortex rejects it for cardinality.
    - pipeline:
        name: "service-metrics-cortex-pipeline"
        routes: [service_processed_metrics]

# Strips the per-event `randomKey` UUID from span-derived RED metrics
# before the Cortex remote-write sink. Without this, data-prepper tags
# every latency bucket with a fresh UUID, blowing past Cortex's default
# 50k series-per-metric limit in minutes.
service-metrics-cortex-pipeline:
  delay: 100
  source:
    pipeline:
      name: "service-map-pipeline"
  processor:
    # Drop only the per-event randomKey. Do NOT strip telemetry.sdk.language:
    # otel_apm_service_map is configured to group_by it and emits one sample
    # per (service, operation, remoteService, sdk.language) per window, so
    # removing the label collapses multi-language services onto the same
    # series+timestamp and Cortex rejects them as duplicate samples.
    # Note: data-prepper event keys use JSON-pointer-style paths; labels
    # set by otel_apm_service_map land under /attributes/<key>, so both
    # the top-level and attributes-scoped paths are listed to be safe.
    - delete_entries:
        with_keys:
          - "/attributes/randomKey"
          - "randomKey"
  sink:
    # Route RED metrics to local Cortex via remote write.
    # Cortex's distributor push endpoint is /api/v1/push (not Prometheus's /api/v1/write).
    - prometheus:
        url: "http://PROMETHEUS_HOST:PROMETHEUS_PORT/api/v1/push"
        insecure: true
        threshold:
          max_events: 500
          flush_interval: 5s