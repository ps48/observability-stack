# Database monitoring receivers and pipelines for PostgreSQL and Valkey.
# Merged into the base config when the otel-demo compose file is enabled.

receivers:
  # Valkey/Redis server metrics via INFO command
  redis:
    endpoint: "valkey-cart:6379"
    collection_interval: 10s
    metrics:
      redis.cmd.calls:
        enabled: true
      redis.cmd.latency:
        enabled: true
      redis.cmd.usec:
        enabled: true
      redis.maxmemory:
        enabled: true

  # PostgreSQL server metrics via monitoring_user
  postgresql:
    endpoint: "postgresql:5432"
    username: monitoring_user
    password: ${env:POSTGRES_MONITORING_PASSWORD}
    databases:
      - ${env:POSTGRES_DB}
    collection_interval: 10s
    tls:
      insecure: true
    metrics:
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.database.locks:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
      postgresql.tup_fetched:
        enabled: true
      postgresql.tup_returned:
        enabled: true
      postgresql.tup_inserted:
        enabled: true
      postgresql.tup_updated:
        enabled: true
      postgresql.tup_deleted:
        enabled: true

  # PostgreSQL server logs from shared volume
  # Log format: "2026-04-20 02:00:25 UTC [979] otelu@otel LOG: ..."
  filelog/postgresql:
    include:
      - /var/log/postgresql/postgresql.log
    start_at: end
    operators:
      - type: copy
        from: body
        to: attributes.raw_body
      - type: regex_parser
        regex: '^(?P<timestamp_field>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) UTC'
        timestamp:
          parse_from: attributes.timestamp_field
          layout: '%Y-%m-%d %H:%M:%S'
          location: UTC
        on_error: send
      - type: move
        from: attributes.raw_body
        to: body
      - type: remove
        field: attributes.timestamp_field
        on_error: send
      - type: add
        field: resource["service.name"]
        value: postgresql
      - type: add
        field: attributes["log_source"]
        value: server

  # Valkey server logs from shared volume
  # Log format: "1:M 20 Apr 2026 01:30:58.307 - DB 0: 10 keys ..."
  filelog/valkey:
    include:
      - /var/log/valkey/valkey.log
    start_at: end
    operators:
      - type: copy
        from: body
        to: attributes.raw_body
      - type: regex_parser
        regex: '^\d+:[A-Z] (?P<timestamp_field>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3})'
        timestamp:
          parse_from: attributes.timestamp_field
          layout: '%d %b %Y %H:%M:%S.%L'
          location: UTC
        on_error: send
      - type: move
        from: attributes.raw_body
        to: body
      - type: remove
        field: attributes.timestamp_field
        on_error: send
      - type: add
        field: resource["service.name"]
        value: valkey-cart
      - type: add
        field: attributes["log_source"]
        value: server

service:
  pipelines:
    # Infrastructure metrics pipeline: Redis + PostgreSQL receivers -> Prometheus
    metrics/infra:
      receivers: [redis, postgresql]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [prometheusremotewrite/cortex, debug]

    # Infrastructure logs pipeline: PostgreSQL + Valkey server logs -> Data Prepper
    logs/infra:
      receivers: [filelog/postgresql, filelog/valkey]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlp/opensearch, debug]
