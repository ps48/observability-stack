{{- /* Default true when the key is absent; honor an explicit false (Helm's `default`
       treats false as empty, so a nil-check is required to let the gate turn off). */ -}}
{{- $manageSecret := true }}
{{- if hasKey .Values "dataPrepperManageSecret" }}{{- $manageSecret = .Values.dataPrepperManageSecret }}{{- end }}
{{- if and (index .Values "data-prepper" "enabled") $manageSecret }}
{{- $opensearchHost := printf "https://%s:9200" (.Values.opensearchServiceName | default "opensearch-cluster-master") -}}
apiVersion: v1
kind: Secret
metadata:
  name: data-prepper-pipeline
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  pipelines.yaml: |
    otlp-pipeline:
      delay: 10
      source:
        otlp:
          port: 21890
          ssl: false
      route:
        # GenAI evaluation results (gen_ai.evaluation.result) and offline evaluation run
        # records (opensearch.test_case.result, opensearch.test_suite_run.result) are OTel
        # log-based events. They go to their own index instead of the general logs index.
        - evaluations: 'getEventType() == "LOG" and (/eventName == "gen_ai.evaluation.result" or /eventName == "opensearch.test_case.result" or /eventName == "opensearch.test_suite_run.result")'
        - logs: 'getEventType() == "LOG" and /eventName != "gen_ai.evaluation.result" and /eventName != "opensearch.test_case.result" and /eventName != "opensearch.test_suite_run.result"'
        - traces: 'getEventType() == "TRACE"'
      sink:
        - pipeline:
            name: "otel-logs-pipeline"
            routes: ["logs"]
        - pipeline:
            name: "genai-evaluation-pipeline"
            routes: ["evaluations"]
        - pipeline:
            name: "otel-traces-pipeline"
            routes: ["traces"]

    otel-logs-pipeline:
      workers: 5
      delay: 10
      source:
        pipeline:
          name: "otlp-pipeline"
      buffer:
        bounded_blocking: {}
      processor:
        - copy_values:
            entries:
              - from_key: "time"
                to_key: "@timestamp"
      sink:
        - opensearch:
            hosts: [{{ $opensearchHost | quote }}]
            username: {{ .Values.opensearchUsername | quote }}
            password: {{ .Values.opensearchPassword | quote }}
            insecure: true
            index_type: log-analytics-plain

    otel-traces-pipeline:
      delay: 100
      source:
        pipeline:
          name: "otlp-pipeline"
      sink:
        - pipeline:
            name: "traces-raw-pipeline"
        - pipeline:
            name: "service-map-pipeline"

    traces-raw-pipeline:
      source:
        pipeline:
          name: "otel-traces-pipeline"
      processor:
        - otel_traces:
            trace_flush_interval: {{ .Values.dataPrepperTraceFlushInterval | default 180 }}
      sink:
        - opensearch:
            hosts: [{{ $opensearchHost | quote }}]
            username: {{ .Values.opensearchUsername | quote }}
            password: {{ .Values.opensearchPassword | quote }}
            insecure: true
            index_type: trace-analytics-plain-raw

    # GenAI evaluation results (gen_ai.evaluation.result) and offline evaluation run
    # records (opensearch.test_case.result, opensearch.test_suite_run.result), all
    # OTel log events from the OTLP logs path. One document per event in
    # otel-v1-genai-evaluation-*, linked to the evaluated span by traceId/spanId.
    # Data Prepper adds normalized fields under attributes.derived.*
    # Mirrors docker-compose/data-prepper/pipelines.template.yaml; the index template is
    # files/genai-evaluation-index-template.json, mounted by templates/data-prepper-templates-configmap.yaml.
    genai-evaluation-pipeline:
      workers: 2
      delay: 10
      source:
        pipeline:
          name: "otlp-pipeline"
      processor:
        - copy_values:
            entries:
              - from_key: "time"
                to_key: "@timestamp"
        # Level: SDK attribute, then AgentCore's, then span if the record has a span.
        - add_entries:
            entries:
              - key: "/attributes/derived.evaluation.level"
                value_expression: "/attributes/opensearch.evaluation.level"
                add_when: "/attributes/opensearch.evaluation.level != null"
              - key: "/attributes/derived.evaluation.level"
                value_expression: "/attributes/aws.bedrock_agentcore.evaluation_level"
                add_when: "/attributes/derived.evaluation.level == null and /attributes/aws.bedrock_agentcore.evaluation_level != null"
              - key: "/attributes/derived.evaluation.level"
                value: "span"
                add_when: "/eventName == \"gen_ai.evaluation.result\" and /attributes/derived.evaluation.level == null and /spanId != null and /spanId != \"\""
              - key: "/attributes/derived.evaluation.level"
                value: "trace"
                add_when: "/eventName == \"gen_ai.evaluation.result\" and /attributes/derived.evaluation.level == null"
        - lowercase_string:
            with_keys: ["/attributes/derived.evaluation.level"]
        - add_entries:
            entries:
              # Source from the instrumentation scope: AgentCore's scope, or the scope attribute
              # every OpenSearch GenAI SDK logger carries; anything else is a generic OTel evaluator.
              - key: "/attributes/derived.evaluation.source"
                value: "agentcore"
                add_when: '/eventName == "gen_ai.evaluation.result" and (startsWith(/instrumentationScope/name, "aws.bedrock_agentcore") or /attributes/aws.bedrock_agentcore.evaluation_level != null)'
              - key: "/attributes/derived.evaluation.source"
                value: "opensearch-sdk"
                add_when: '/eventName == "gen_ai.evaluation.result" and /attributes/derived.evaluation.source == null and /instrumentationScope/attributes/opensearch.genai.sdk.name != null'
              - key: "/attributes/derived.evaluation.source"
                value: "otel"
                add_when: '/eventName == "gen_ai.evaluation.result" and /attributes/derived.evaluation.source == null'
              - key: "/attributes/derived.session.id"
                value_expression: "/attributes/gen_ai.conversation.id"
                add_when: "/attributes/gen_ai.conversation.id != null"
              - key: "/attributes/derived.session.id"
                value_expression: "/attributes/session.id"
                add_when: "/attributes/derived.session.id == null and /attributes/session.id != null"
              - key: "/attributes/derived.evaluation.target_trace_id"
                value_expression: "/traceId"
                add_when: "/traceId != null and /traceId != \"\""
              - key: "/attributes/derived.evaluation.target_trace_id"
                value_expression: "/attributes/opensearch.evaluation.trace_id"
                add_when: "/attributes/derived.evaluation.target_trace_id == null and /attributes/opensearch.evaluation.trace_id != null"
        # Deterministic id: retries and re-imports of the same result do not duplicate it.
        - add_entries:
            entries:
              - key: "/evaluationId"
                format: "${/eventName}|${/time}|${/traceId}|${/spanId}|${/attributes/derived.session.id}|${/attributes/gen_ai.evaluation.name}|${/attributes/test.case.id}|${/instrumentationScope/name}"
      sink:
        - opensearch:
            hosts: [{{ $opensearchHost | quote }}]
            username: {{ .Values.opensearchUsername | quote }}
            password: {{ .Values.opensearchPassword | quote }}
            insecure: true
            index: "otel-v1-genai-evaluation-%{yyyy.MM.dd}"
            document_id: "${/evaluationId}"
            template_type: index-template
            template_file: /usr/share/data-prepper/templates/genai-evaluation-index-template.json

    service-map-pipeline:
      delay: 100
      source:
        pipeline:
          name: "otel-traces-pipeline"
      processor:
        - otel_apm_service_map:
            group_by_attributes: [telemetry.sdk.language]
            window_duration: 10s
      route:
        - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
        - service_processed_metrics: 'getEventType() == "METRIC"'
      sink:
        - opensearch:
            hosts: [{{ $opensearchHost | quote }}]
            username: {{ .Values.opensearchUsername | quote }}
            password: {{ .Values.opensearchPassword | quote }}
            index_type: otel-v2-apm-service-map
            routes: [otel_apm_service_map_route]
            insecure: true
        # Fan out service-derived RED metrics to a dedicated pipeline that
        # strips the per-event randomKey UUID before Cortex rejects it for
        # cardinality. Don't drop telemetry.sdk.language — the service_map
        # processor groups by it and collapsing collides multi-language
        # services onto the same (series, timestamp) tuple.
        - pipeline:
            name: "service-metrics-cortex-pipeline"
            routes: [service_processed_metrics]

    # Strips the per-event `randomKey` UUID before Cortex remote-write.
    # Data-prepper event keys use JSON-pointer paths; the otel_apm_service_map
    # processor writes them under /attributes/<key>, so both paths are listed.
    service-metrics-cortex-pipeline:
      delay: 100
      source:
        pipeline:
          name: "service-map-pipeline"
      processor:
        - delete_entries:
            with_keys:
              - "/attributes/randomKey"
              - "randomKey"
      sink:
        - prometheus:
            url: "http://{{ .Release.Name }}-prometheus-server:80/api/v1/push"
            insecure: true
            threshold:
              max_events: 500
              flush_interval: 5s
{{- end }}
